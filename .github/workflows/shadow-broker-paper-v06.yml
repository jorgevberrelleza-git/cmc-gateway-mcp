name: Shadow Agent Paper Broker v0.6 - zero live orders
on:
  pull_request:
    paths:
      - 'src/learning/agent-broker-paper-v06.mjs'
      - 'scripts/learning-agent-paper-broker-v06*'
      - 'scripts/learning-hourly-cycle.mjs'
      - '.github/workflows/shadow-broker-paper-v06.yml'
      - 'package.json'
      - 'docs/shadow-agent-paper-broker-v06.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic_paper:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LEARNING_EXECUTION_ENABLED: 'false'
      LEARNING_REASONING_ENABLED: 'false'
      LEARNING_AGENT_PAPER_BROKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect syntax
        run: |
          node --check src/learning/agent-broker-paper-v06.mjs
          node --check scripts/learning-agent-paper-broker-v06.mjs
          node --check scripts/learning-agent-paper-broker-v06-selftest.mjs
          node --check scripts/learning-hourly-cycle.mjs
      - name: Autonomous risk committee baseline
        run: npm run learning:autonomy:selftest
      - name: Simulated state machine, next-quote execution and safety
        run: npm run learning:agent:paper:selftest
      - name: Existing future forecast validity contract
        run: npm run learning:forecast:selftest
