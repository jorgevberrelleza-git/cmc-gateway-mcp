name: Shadow source independence
on:
  push:
    branches:
      - feature/paprika-first-source-quarantine-20261114
  pull_request:
    paths:
      - 'src/research.mjs'
      - 'src/learning/quote-routing-policy.mjs'
      - 'src/learning/regime-evidence.mjs'
      - 'src/learning/shadow-v2.mjs'
      - 'src/learning/runtime-config.mjs'
      - 'src/learning/skill-orchestrator.mjs'
      - 'scripts/learning-skills-daily.mjs'
      - 'scripts/learning-independent-source-skill-selftest.mjs'
      - 'scripts/learning-collector.mjs'
      - 'scripts/learning-quote-routing-policy-selftest.mjs'
      - 'scripts/learning-paprika-macro-unknown-selftest.mjs'
      - '.github/workflows/shadow-source-independence.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check src/research.mjs
          node --check src/learning/quote-routing-policy.mjs
          node --check src/learning/regime-evidence.mjs
          node --check src/learning/shadow-v2.mjs
          node --check src/learning/runtime-config.mjs
          node --check scripts/learning-collector.mjs
          node --check src/learning/skill-orchestrator.mjs
          node --check scripts/learning-skills-daily.mjs
      - name: Independent source policy
        run: node scripts/learning-quote-routing-policy-selftest.mjs
      - name: Unknown macro fail closed
        run: node scripts/learning-paprika-macro-unknown-selftest.mjs
      - name: Existing Paprika contract
        run: node scripts/learning-coinpaprika-quotes-selftest.mjs
      - name: Existing Shadow regime and consistency
        run: node scripts/learning-v2-selftest.mjs
      - name: Existing research and CMC failure contract
        run: node scripts/learning-safe-research-selftest.mjs
      - name: Independent provider skills telemetry
        run: node scripts/learning-independent-source-skill-selftest.mjs
      - name: Existing CMC fallback selftest
        run: node scripts/learning-cmc-public-quotes-selftest.mjs

      - name: Existing skills planner regressions
        run: node scripts/learning-skills-selftest.mjs
