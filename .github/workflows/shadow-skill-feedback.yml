name: Shadow daily skills evidence feedback
on:
  push:
    branches:
      - feature/skills-feedback-loop-20261114
  pull_request:
    paths:
      - 'src/learning/skill-feedback-v01.mjs'
      - 'scripts/learning-skills-daily.mjs'
      - 'scripts/learning-skill-feedback-selftest.mjs'
      - '.github/workflows/shadow-skill-feedback.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check src/learning/skill-feedback-v01.mjs
          node --check scripts/learning-skill-feedback-selftest.mjs
          node --check scripts/learning-skills-daily.mjs
      - name: Daily skills evidence regressions
        run: node scripts/learning-skill-feedback-selftest.mjs
      - name: Existing forward signal regressions
        run: node scripts/learning-forward-signal-outcomes-selftest.mjs
      - name: Existing skill planner regressions
        run: node scripts/learning-skills-selftest.mjs
