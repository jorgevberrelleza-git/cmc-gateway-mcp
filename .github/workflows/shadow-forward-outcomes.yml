name: Shadow prospective outcome evaluator
on:
  push:
    branches:
      - feature/forward-outcomes-20261111
  pull_request:
    paths:
      - 'src/learning/forward-signal-outcomes.mjs'
      - 'scripts/learning-forward-signal-outcomes-selftest.mjs'
      - '.github/workflows/shadow-forward-outcomes.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse modules
        run: node --check src/learning/forward-signal-outcomes.mjs && node --check scripts/learning-forward-signal-outcomes-selftest.mjs
      - name: Deterministic outcome and no-lookahead tests
        run: node scripts/learning-forward-signal-outcomes-selftest.mjs
