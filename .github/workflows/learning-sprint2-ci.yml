name: Learning Engine CI

on:
  push:
    branches:
      - feature/learning-engine-v0.1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Syntax checks
        run: npm run check

      - name: Sprint 1 learning self-test
        run: npm run learning:selftest

      - name: Sprint 2 learning self-test
        run: npm run learning:sprint2:selftest

      - name: Sprint 3 learning self-test
        run: npm run learning:sprint3:selftest

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d learning_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/learning_test
      PGSSL: disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Initialize learning schema
        run: npm run learning:db:init

      - name: PostgreSQL integration self-test
        run: npm run learning:db:selftest
