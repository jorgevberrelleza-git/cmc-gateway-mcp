services:
  - type: web
    name: cmc-gateway-mcp
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: CMC_MCP_API_KEY
        sync: false
      - key: OAUTH_LOGIN_SECRET
        sync: false
      - key: OAUTH_SIGNING_SECRET
        generateValue: true
      - key: ALLOW_LEGACY_BEARER
        value: "false"
      - key: CMC_MAX_CALLS_PER_MINUTE
        value: "9"
      - key: CMC_TIMEOUT_MS
        value: "20000"
      - key: SNAPSHOT_MAX_REQUESTS_PER_10_MIN
        value: "6"
      - key: BITSO_REST_BASE
        value: "https://bitso.com/api/v3"
      - key: BITSO_WS_URL
        value: "wss://ws.bitso.com"
      - key: BITSO_CAPTURE_MS
        value: "18000"
      - key: BITSO_TIMEOUT_MS
        value: "12000"
      - key: BITSO_PREFERRED_MINORS
        value: "mxn,usd,usdc,usdt"
