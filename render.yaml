services:
  - type: web
    name: cmc-gateway-mcp
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: CMC_MCP_API_KEY
        sync: false
      - key: OAUTH_LOGIN_SECRET
        sync: false
      - key: OAUTH_SIGNING_SECRET
        generateValue: true
      - key: ALLOW_LEGACY_BEARER
        value: "false"
      - key: CMC_MAX_CALLS_PER_MINUTE
        value: "25"
      - key: CMC_TIMEOUT_MS
        value: "20000"
      - key: SNAPSHOT_MAX_REQUESTS_PER_10_MIN
        value: "6"
